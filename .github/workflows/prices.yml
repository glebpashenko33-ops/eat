# Цены Магнита через его прямой API: работает с серверов GitHub, даже когда компьютер выключен.
# Остальные сети не пускают зарубежные серверы — их цены собирает prices.bat на вашем компьютере.
# Расписание срабатывает только в основной ветке репозитория.
name: Цены Магнита

on:
  schedule:
    - cron: "17 3,11,19 * * *"   # 06:17, 14:17, 22:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  magnit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать цены
        run: python -m collector collect --api-only --stores magnit --out web/data/prices.ci.json
      - name: Сохранить
        run: |
          git config user.name "eat-prices-bot"
          git config user.email "eat-prices-bot@users.noreply.github.com"
          git add web/data/prices.ci.json
          git diff --cached --quiet && exit 0
          git commit -m "Цены Магнита (автообновление)"
          git pull --rebase
          git push
