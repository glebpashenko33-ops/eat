<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eat — рацион под бюджет</title>
<meta name="description" content="Меню на неделю с рецептами и списком покупок по живым ценам продуктовых сетей.">
<meta name="theme-color" content="#1f7a4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><span class="logo" aria-hidden="true">🥗</span><b>eat</b></div>
    <p class="tag">Рацион с рецептами под ваш бюджет — по живым ценам магазинов</p>
  </div>
</header>

<main class="wrap">
  <form id="form" class="card" autocomplete="off">
    <div class="row two">
      <label class="field">
        <span>Бюджет, ₽</span>
        <input id="budget" type="number" inputmode="numeric" min="300" step="100" value="5000" required>
      </label>
      <label class="field">
        <span>На сколько дней</span>
        <select id="days"></select>
      </label>
    </div>

    <fieldset>
      <legend>Кто ест</legend>
      <div id="people"></div>
      <button type="button" id="addPerson" class="ghost">+ Добавить человека</button>
    </fieldset>

    <fieldset>
      <legend>Магазины</legend>
      <div id="stores" class="chips"></div>
      <p id="pricesInfo" class="hint"></p>
      <label class="field inline">
        <span>За покупками хожу в</span>
        <select id="maxStores">
          <option value="1">1 магазин</option>
          <option value="2" selected>до 2 магазинов</option>
          <option value="3">до 3 магазинов</option>
          <option value="99">сколько угодно</option>
        </select>
      </label>
    </fieldset>

    <details>
      <summary>Ограничения, нелюбимое и запасы дома</summary>
      <fieldset>
        <legend>Питание</legend>
        <div id="diets" class="chips"></div>
      </fieldset>
      <fieldset>
        <legend>Уже есть дома <small>(не покупать)</small></legend>
        <div id="pantry" class="chips"></div>
      </fieldset>
      <fieldset>
        <legend>Не ем</legend>
        <div id="dislikes" class="chips small"></div>
      </fieldset>
    </details>

    <div class="actions">
      <button type="submit" id="go" class="primary">Подобрать рацион</button>
      <button type="button" id="again" class="ghost" hidden>Другое меню</button>
    </div>
  </form>

  <section id="result" hidden>
    <div class="card summary" id="summary"></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="menu" aria-selected="true">Меню</button>
      <button role="tab" data-tab="shop" aria-selected="false">Покупки</button>
      <button role="tab" data-tab="prices" aria-selected="false">Цены</button>
    </nav>
    <div id="tab-menu" class="tab"></div>
    <div id="tab-shop" class="tab" hidden></div>
    <div id="tab-prices" class="tab" hidden></div>
  </section>
</main>

<dialog id="recipe">
  <form method="dialog"><button class="close" aria-label="Закрыть">✕</button></form>
  <div id="recipeBody"></div>
</dialog>

<footer class="wrap foot">
  Нормы — по формуле Миффлина — Сан Жеора и рекомендациям ВОЗ. Состав продуктов усреднённый, цены — с сайтов сетей на момент сбора.
</footer>

<script src="planner.js"></script>
<script src="app.js"></script>
</body>
</html>
